# ShadowPaste V15 — full stack (Phase 10).
# STATUS: real compose file, NOT run in the authoring environment (no Docker here).
# Bring up: `docker compose up`. Set values from .env (see .env.example).
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shadowpaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-shadowpaste}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadowpaste}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shadowpaste}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-shadowpaste}
      REDIS_URL: redis://redis:6379
      SHADOWPASTE_HMAC_SECRET: ${SHADOWPASTE_HMAC_SECRET}
      PORT: 8787
    ports: ["8787:8787"]

  web:
    image: nginx:alpine
    volumes: ["./index.html:/usr/share/nginx/html/index.html:ro"]
    ports: ["8080:80"]

volumes:
  pgdata:
