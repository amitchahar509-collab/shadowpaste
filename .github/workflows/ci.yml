# ShadowPaste V19 — CI (Phase 12)
# Runs on every push / PR to main.  Four jobs: lint, test, build, security-scan.
# Bun deps are cached across runs for speed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # lint — fast feedback on ESLint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-lint-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock*') }}
          restore-keys: |
            bun-lint-${{ runner.os }}-
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Run ESLint
        run: bun run lint

  # ---------------------------------------------------------------------------
  # typecheck — enforced TypeScript checks (app + node/cli/test surfaces)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-typecheck-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock*') }}
          restore-keys: |
            bun-typecheck-${{ runner.os }}-
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          # prisma/schema.prisma declares provider = "postgresql", so the URL must
          # use the postgresql:// protocol or `prisma generate` aborts with P1012.
          # No live connection is made by `generate` — a protocol-valid URL is enough.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadowpaste"

      - name: Run typecheck (app + node)
        run: bun run typecheck

  # ---------------------------------------------------------------------------
  # test — start dev server, run integration script if present
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # tests are environment-dependent (external creds etc.)

    # `prisma db push` and the app both need a REAL PostgreSQL server (the schema
    # declares provider = "postgresql"). A service container gives CI an ephemeral
    # one on localhost:5432 — no external database is required.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowpaste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadowpaste"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-test-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock*') }}
          restore-keys: |
            bun-test-${{ runner.os }}-
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL service
        run: bunx prisma db push --skip-generate --accept-data-loss

      - name: Start dev server (background)
        run: |
          nohup bun run dev > dev.log 2>&1 &
          echo $! > .dev.pid
          # Wait for the server to accept connections (up to 60s)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Dev server is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null || (echo "Server did not come up:"; cat dev.log; exit 1)

      - name: Run integration tests (if present)
        run: |
          if [ -f tests/run-all.sh ]; then
            bash tests/run-all.sh
          else
            echo "tests/run-all.sh not found — running smoke checks instead"
            # Smoke: seed (dev-only) + dashboard read + confirm mutating MCP
            # endpoint rejects anonymous callers (expects HTTP 401).
            curl -fsS -X POST http://127.0.0.1:3000/api/seed || echo "seed: non-fatal"
            curl -fsS http://127.0.0.1:3000/api/dashboard | head -c 500
            echo
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/mcp/call \
              -H 'Content-Type: application/json' \
              -d '{"agentId":"smoke","toolName":"db.schema.drop","input":{"schema":"public"}}')
            echo "anonymous /api/mcp/call -> $code (expect 401)"
            test "$code" = "401"
          fi

      - name: Show dev log on failure
        if: failure()
        run: cat dev.log || true

      - name: Stop dev server
        if: always()
        run: |
          if [ -f .dev.pid ]; then
            kill "$(cat .dev.pid)" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # build — full Next.js production build
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-build-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock*') }}
          restore-keys: |
            bun-build-${{ runner.os }}-
            bun-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('**/*.ts', '**/*.tsx', 'package.json', 'next.config.ts') }}
          restore-keys: |
            next-build-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          # Protocol-valid postgresql:// URL — `generate` and `next build` do not
          # open a connection, but Prisma rejects a `file:` URL for this provider.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadowpaste"

      # next.config.ts enforces type checking during the build
      # (typescript.ignoreBuildErrors: false), so a type error fails this job.
      - name: Next.js production build
        run: bun run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadowpaste"
          AUTH_PEPPER: "ci-build-pepper"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone output
        # Block scalar: the inline form was invalid YAML because the unquoted
        # value contains ": " (inside the echo string), which YAML reads as a
        # nested mapping. That made the WHOLE workflow unparseable, so no job
        # ever ran — GitHub reported "failed because of a workflow file issue".
        run: |
          test -f .next/standalone/server.js && echo "OK - .next/standalone/server.js produced"

  # ---------------------------------------------------------------------------
  # security-scan — grep for common leaked secret patterns in src/ (excluding
  # tests).  Fails if any are found.  Uses ripgrep.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan src/ for leaked secrets
        run: |
          set -e
          # Common live credential prefixes.  Adjust with care — false positives
          # block CI, false negatives leak secrets.
          PATTERNS='(ghp_[A-Za-z0-9]{36,}|gho_[A-Za-z0-9]{36,}|ghs_[A-Za-z0-9]{36,}|ghr_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,}|sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|sk_test_[A-Za-z0-9]{16,}|rk_test_[A-Za-z0-9]{16,}|AKIA[A-Z0-9]{16}|ASIA[A-Z0-9]{16}|AIza[A-Za-z0-9_\-]{35}|xox[baprs]-[0-9A-Za-z-]+|sk-ant-[A-Za-z0-9_\-]{20,}|glpat-[A-Za-z0-9_\-]{20,})'

          # Search src/ but skip tests, fixtures, and the demo seed file
          # (which intentionally contains MASKED placeholders, not live secrets).
          HITS=$(rg -n --no-heading -P "$PATTERNS" \
              src/ \
              --glob '!**/*.test.*' \
              --glob '!**/__tests__/**' \
              --glob '!**/seed.ts' \
              --glob '!**/scanner.ts' \
              --glob '!**/attacks.ts' \
              2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::error::Potential live secret found in src/"
            echo "$HITS"
            exit 1
          fi
          echo "No live secret patterns found in src/ — clean."

      - name: Scan for plaintext password / token assignments
        run: |
          set -e
          # Catch `password = "realvalue"` style leaks (excluding obvious
          # placeholders, env-var reads, and the masked demo data).
          HITS=$(rg -n --no-heading -P \
              '(?i)(password|passwd|secret|api[_-]?key|access[_-]?token)\s*[:=]\s*["'\''](?!(change-me|changeme|<[^>]+>|\$\{|process\.env|REDACTED|example|test|demo|placeholder|your[_-]?)).{8,}["'\'']' \
              src/ \
              --glob '!**/*.test.*' \
              --glob '!**/seed.ts' \
              2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::warning::Suspicious hardcoded credential assignment(s) — review:"
            echo "$HITS"
            # warning only — many legit places assign masked placeholder values
          else
            echo "No hardcoded credential assignments in src/ — clean."
          fi
