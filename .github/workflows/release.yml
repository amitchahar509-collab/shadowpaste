# Release automation.
#
# Triggered by a semver tag. Deliberately gated on the FULL validation suite:
# a release that skips tests to ship faster is how a regression reaches users.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without publishing"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowpaste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadowpaste"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema
        run: bunx prisma db push --skip-generate --accept-data-loss

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test tests/unit/

      - name: Coverage gate
        run: node scripts/check-coverage.mjs

      - name: Build
        run: bun run build

      # Proves the backup path works on a clean database before we tag a release
      # that operators will rely on for disaster recovery.
      - name: Backup + restore-validation smoke
        run: |
          node scripts/backup.mjs backup --out ./backups
          FILE=$(ls -t ./backups/*.json | head -1)
          node scripts/backup.mjs verify --file "$FILE"

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag and package.json agree: $PKG"

  publish:
    name: Publish release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build changelog since previous tag
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${GITHUB_REF#refs/tags/}"
          else
            RANGE="${GITHUB_REF#refs/tags/}"
          fi
          {
            echo "notes<<EOF_NOTES"
            echo "## Changes"
            git log --no-merges --pretty='- %s' "$RANGE" || true
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
